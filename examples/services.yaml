devices:
  PC1:
    type: host
    interfaces: [GigabitEthernet0/0]
  R1:
    type: router
    interfaces: [GigabitEthernet0/0, GigabitEthernet0/1]
  WEB1:
    type: host
    interfaces: [GigabitEthernet0/0]
    services:
      - type: http
        port: 80
        body: "Hello from RIOS!\n"
      - type: tcp-echo
      - type: udp-echo
      - type: dns
        records:
          www.lab: 203.0.113.2
      - type: ntp
links:
  - endpoints: [PC1:GigabitEthernet0/0, R1:GigabitEthernet0/0]
  - endpoints: [R1:GigabitEthernet0/1, WEB1:GigabitEthernet0/0]
